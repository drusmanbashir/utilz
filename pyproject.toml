[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utilz"
description = "Utility functions and helpers for medical imaging and ML workflows"
requires-python = ">=3.9"
dynamic = ["version"]

authors = [{ name = "Usman Bashir" }]

# -------------------------
# BASE (NEUTRAL) — both agent and dl envs
# -------------------------
# Pure Python / widely ABI-stable. No torch, SimpleITK, itk.
# Neutral modules: api_keys, stringz, listify, cprint, helpers (when not
# dragging fileio — prefer submodule imports), dictops, …
dependencies = [
  "fastcore>=1.12.16",
  "fasttransform==0.0.2",
  "ipdb>=0.13.13",
  "ipython>=8.12.3",
  "ipywidgets>=8.1.3",
  "numpy>=2,<3",
  "pandas>=2.2.3",
  "PyYAML>=6.0.2",
  "tqdm>=4.66.5",
  "beautifulsoup4>=4.13.3",
]

[project.optional-dependencies]

# -------------------------
# AGENT — LLM / hub / notebooks (no torch / imaging C-exts)
# -------------------------
# api_keys is stdlib-only; this extra documents the agent install surface.
agent = []

# -------------------------
# OPTIONAL light extras
# -------------------------
optional = [
  "nltk>=3.9.3",
  "imageio>=2.37.0",
]

dev = [
  "pytest>=8.3.3",
]

# -------------------------
# FRAN / DL — ML + imaging (dl conda env only)
# -------------------------
ml = [
  "torchvision",
  "torchaudio",
  "ray[tune]",
]

# Dangerous in Slicer / unwanted in agent LSP — explicit opt-in
imaging = [
  "itk>=5.4.2.post1",
  "SimpleITK>=2.2.0",
]

fran = [
  "utilz[optional,ml,imaging]",
]

# -------------------------
# FULL
# -------------------------
full = [
  "utilz[agent,fran,dev]",
]

[tool.setuptools.packages.find]
include = ["utilz*"]

[tool.setuptools.package-data]
utilz = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
